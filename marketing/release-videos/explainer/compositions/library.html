<template>
  <style>

      @font-face { font-family: "JetBrains Sans"; font-weight: 600; font-style: normal; src: url("assets/fonts/jetbrains_sans_semibold.ttf") format("truetype"); }
      @font-face { font-family: "JetBrains Sans"; font-weight: 700; font-style: normal; src: url("assets/fonts/jetbrains_sans_bold.ttf") format("truetype"); }

      #root .lt .ttl em { font-style: normal; color: #ff5252; }

  </style>
  <div id="root" data-composition-id="library" data-width="1920" data-height="1080">
    <div class="world" id="library-world">
      <div class="screen" id="library-scrA"><div class="cam" id="library-camA" data-layout-allow-overflow><img src="assets/screens/library.png" alt="Library" /></div></div>
      <div class="screen later" id="library-scrB"><div class="cam" id="library-camB" data-layout-allow-overflow><img src="assets/screens/catalog.png" alt="A catalog with filter chips" /></div></div>
      <div class="scrim" data-layout-ignore></div>
      <div class="lt" id="library-lt1">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      function camInit(sel) { tl.set(sel, { transformOrigin: "50% 50%", scale: 1, x: 0, y: 0 }, 0); }
      function punch(sel, s, px, py, at, dur, ease) { tl.to(sel, { scale: s, x: (960 - px) * s, y: (540 - py) * s, duration: dur || 0.55, ease: ease || "power2.inOut" }, at); }
      function wide(sel, at, dur) { tl.to(sel, { scale: 1, x: 0, y: 0, duration: dur || 0.5, ease: "power2.inOut" }, at); }
      function inText(sel, at, dur) { tl.fromTo(sel, { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: dur || 0.22, ease: "power3.out" }, at); }
      function outText(sel, at) { tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power3.in" }, at); }
      function wordsIn(sel, at) { tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", stagger: 0.067 }, at); }
      function greyIn(sel, at) { tl.fromTo(sel, { color: "#5c6166" }, { color: "#f5f7f8", duration: 0.2, ease: "power2.out", stagger: 0.09 }, at); }
      function show(sel, at) { tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, at); }
      function swap(outSel, inSel, at) { tl.to(outSel, { opacity: 0, duration: 0.3, ease: "power2.inOut" }, at); tl.fromTo(inSel, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, at); }
      function whipX(outSel, inSel, at, dir) { dir = dir || 1; tl.to(outSel, { x: -220 * dir, opacity: 0, duration: 0.22, ease: "power3.in" }, at); tl.fromTo(inSel, { x: 220 * dir, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at + 0.12); }
      function whipY(outSel, inSel, at) { tl.to(outSel, { y: -220, opacity: 0, duration: 0.22, ease: "power3.in" }, at); tl.fromTo(inSel, { y: 220, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, at + 0.12); }
      function dip(sel, at) { tl.fromTo(sel, { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, at); }
      function register(id) { window.__timelines = window.__timelines || {}; window.__timelines[id] = tl; }
      tl.fromTo("#library-world", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0);
      camInit("#library-camA"); camInit("#library-camB");
      // A: Library (0-4.4)
      show("#library-lt1", 0.45); wordsIn("#library-lt1 .ttl .w", 0.5); inText("#library-lt1 .sub", 0.8);
      punch("#library-camA", 1.4, 720, 340, 1.0);
      wide("#library-camA", 3.4);
      outText("#library-lt1", 4.15);
      // B: a catalog (4.4-8.2)
      whipX("#library-scrA", "#library-scrB", 4.25);
      show("#library-lt2", 4.8); greyIn("#library-lt2 .ttl", 4.8); inText("#library-lt2 .sub", 5.05);
      punch("#library-camB", 1.35, 900, 355, 5.4);
      outText("#library-lt2", 7.7);
      // exit: whip up; Settings lands from below
      tl.to("#library-world", { y: -220, opacity: 0, duration: 0.22, ease: "power3.in" }, 7.95);
      register("library");
    })();
  </script>
